version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    container_name: guardflow-postgres
    environment:
      - POSTGRES_DB=guardflow_db
      - POSTGRES_USER=guardflow
      - POSTGRES_PASSWORD=guardflow123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardflow -d guardflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: guardflow-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:


