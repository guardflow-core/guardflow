# GuardFlow Production Docker Compose
version: '3.8'

services:
  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://guardflow:password@db:5432/guardflow
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-production-secret-key
      - DEBUG=False
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  # Frontend React
  frontend:
    build:
      context: ./guardflow-web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8002
    depends_on:
      - backend
    restart: unless-stopped

  # Database PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=guardflow
      - POSTGRES_USER=guardflow
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:


